name: wasm-bindgen-bot post
description: >-
  Validates the analyze result and posts it as wasm-bindgen-bot. Holds a
  GitHub App token scoped to issues and pull requests, and never runs a model.

inputs:
  app-id:
    required: true
  private-key:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: wasm-bindgen-bot-result
        path: ${{ runner.temp }}/wasm-bindgen-bot

    - id: token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-issues: write
        permission-pull-requests: write

    - shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        BOT_RESULT: ${{ runner.temp }}/wasm-bindgen-bot/result.json
      run: node "$GITHUB_ACTION_PATH/../scripts/post.mjs"
