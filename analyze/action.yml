name: wasm-bindgen-bot analyze
description: >-
  Runs Claude Code over a PR or issue and uploads its structured result.
  Reviews and triage are read-only; investigations and PRs run code in a
  sandbox user that can't reach the tokens. Holds the AI Gateway token but no
  GitHub write access.

inputs:
  cf-aig-token:
    description: Cloudflare AI Gateway token
    required: true
  cf-account-id:
    description: Cloudflare account ID
    required: true
  cf-gateway-id:
    description: Cloudflare AI Gateway ID
    required: true
  review-model:
    default: claude-opus-5-5
  triage-model:
    default: claude-sonnet-5-5
  investigate-model:
    default: claude-opus-5-5
  pr-model:
    default: claude-opus-5-5
  review-effort:
    default: high
  triage-effort:
    default: medium
  investigate-effort:
    default: high
  pr-effort:
    default: high
  max-budget-usd:
    description: Budget for reviews and triage
    default: '5'
  investigate-budget-usd:
    default: '10'
  pr-budget-usd:
    default: '20'
  claude-code-version:
    default: 2.1.303
  github-token:
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - id: ctx
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BOT_DIR: ${{ github.workspace }}/bot-work
      run: node "$GITHUB_ACTION_PATH/../scripts/context.mjs"

    - if: steps.ctx.outputs.mode
      uses: actions/checkout@v5
      with:
        ref: ${{ steps.ctx.outputs.checkout-ref }}
        path: bot-work/repo
        persist-credentials: false
        # Fork PR code is only read by the model, never built or executed;
        # only issue modes run code, against the default branch.
        allow-unsafe-pr-checkout: true

    - if: steps.ctx.outputs.mode
      shell: bash
      run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${{ inputs.claude-code-version }}"

    - if: steps.ctx.outputs.mode
      shell: bash
      env:
        BOT_DIR: ${{ github.workspace }}/bot-work
        BOT_REVIEW_MODEL: ${{ inputs.review-model }}
        BOT_REVIEW_EFFORT: ${{ inputs.review-effort }}
        BOT_REVIEW_BUDGET: ${{ inputs.max-budget-usd }}
        BOT_ASK_MODEL: ${{ inputs.review-model }}
        BOT_ASK_EFFORT: ${{ inputs.review-effort }}
        BOT_ASK_BUDGET: ${{ inputs.max-budget-usd }}
        BOT_TRIAGE_MODEL: ${{ inputs.triage-model }}
        BOT_TRIAGE_EFFORT: ${{ inputs.triage-effort }}
        BOT_TRIAGE_BUDGET: ${{ inputs.max-budget-usd }}
        BOT_INVESTIGATE_MODEL: ${{ inputs.investigate-model }}
        BOT_INVESTIGATE_EFFORT: ${{ inputs.investigate-effort }}
        BOT_INVESTIGATE_BUDGET: ${{ inputs.investigate-budget-usd }}
        BOT_REBASE_MODEL: ${{ inputs.pr-model }}
        BOT_REBASE_EFFORT: ${{ inputs.pr-effort }}
        BOT_REBASE_BUDGET: ${{ inputs.pr-budget-usd }}
        BOT_PR_MODEL: ${{ inputs.pr-model }}
        BOT_PR_EFFORT: ${{ inputs.pr-effort }}
        BOT_PR_BUDGET: ${{ inputs.pr-budget-usd }}
        BOT_GH_TOKEN: ${{ inputs.github-token }}
        CF_AIG_TOKEN: ${{ inputs.cf-aig-token }}
        CF_ACCOUNT_ID: ${{ inputs.cf-account-id }}
        CF_GATEWAY_ID: ${{ inputs.cf-gateway-id }}
      run: node "$GITHUB_ACTION_PATH/../scripts/run.mjs"

    - uses: actions/upload-artifact@v4
      with:
        name: wasm-bindgen-bot-result
        path: bot-work/result.json
        retention-days: 7
